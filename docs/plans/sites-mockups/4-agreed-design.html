S.transfers={g:'The window',l:'Transfers bar, opened',d:'One row per action',

   `<div style="display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--divider)">${bt('Pause transfers',{i:'pause'})}${bt('Retry failed',{i:'retry'})}</div>`)}</div>`};
const sheet=(t,body)=>`<div style="margin:auto 0 0;border-top:1px solid var(--divider);background:var(--chrome);border-radius:16px 16px 0 0;padding:14px"><div style="width:36px;height:4px;border-radius:2px;background:var(--divider);margin:0 auto 10px"></div><b style="font-weight:600;font-size:15px">${t}</b>${body}</div>`;
S['phone-sheets']={g:'Phone',l:'Upload, delete, trouble',d:'Bottom sheets, not dialogs',
 notes:['Left: Upload offers the phone\'s own files or the server\'s folders. Middle: Delete on server as a sheet with the count, the red button and Cancel. Right: a site that cannot be reached, with Retry.','Sheets come up from the bottom so the buttons are under the thumb.','Is upload from the phone\'s own files wanted at first? It has the same keep-the-tab-open limit as in the desktop browser.'],
 r:()=>`<div class="phones">${phone('nas.home.lan','media › isos',pf('backups','Folder',0,'d')+pf('photos-2026','Folder',0,'d'),
   sheet('Upload to /media/isos',`<div style="display:grid;gap:8px;margin-top:10px">${bt('Files on this phone',{acc:1,i:'upload'})}${bt('Files on home-server',{i:'folder'})}</div><div class="sec" style="font-size:12px;margin-top:8px">From this phone: keep the page open until it finishes.</div>`))}
  ${phone('nas.home.lan','media › isos',pf('backups','Folder',1,'d')+pf('photos-2026','Folder',0,'d'),
   sheet('Delete on server?',`<p style="margin:8px 0"><b>backups</b> and the 1,842 items inside it (86.4 GB) will be deleted from nas.home.lan. Inbound cannot bring them back.</p><div style="display:grid;gap:8px">${bt('Delete on server',{dng:1,i:'trash'})}${bt('Cancel',{acc:1})}</div>`))}
  ${phone('nas.home.lan','not reachable',`<div class="state" style="padding:40px 20px">${ic('alert','st-wait')}<div class="t">Can't reach nas.home.lan</div><div>It did not answer on port 22. Trying again in 8 s.</div><div style="display:flex;gap:8px">${bt('Retry now',{acc:1})}${bt('Edit site')}</div></div>`,
   `<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--chrome);border-top:1px solid var(--divider)"><b style="font-weight:600">Transfers</b><span class="st-wait">2 waiting for nas.home.lan</span></div>`)}</div>`};

const xrow=(n,st,cls,pct)=>`<div style="padding:8px 12px;border-bottom:1px solid var(--divider)"><div style="display:flex;gap:8px;align-items:center"><div style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n}</div><div class="${cls}" style="font-size:12px">${st}</div></div><span class="sec">${ic(pct?'pause':'trash')}</span></div>${pct?pbar(pct):''}</div>`;
S.ext={g:'Extension',l:'The popup',d:'One line, nothing more',
 notes:['My suggestion is to keep Sites out of the extension. The popup stays a list of downloads and gains one line that says site transfers are running and opens the Sites view.','The line comes from the same summary the status bar chip uses.','The other option is nothing at all in the extension. A site browser in a 360 px popup is not something I would build.'],
 r:()=>`<div class="phones"><div class="pop"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--divider)"><span class="c-info">${ic('download')}</span><b style="font-weight:600">Inbound</b><span class="grow" style="flex:1"></span><span class="st-done" style="font-size:12px">Connected</span></div>
  <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--divider);background:var(--hl);cursor:pointer" data-go="browse">${ic('server')}<span style="flex:1">Sites · 2 running · 156 MB/s</span><span class="sec" style="font-size:12px">Open in Inbound</span>${ic('chevr')}</div>
  ${xrow('lecture-04.mp4','Downloading 63.0% · 9.2 MB/s','st-active',63)}${xrow('archlinux-2026.11.01-x86_64.iso','Downloading 31.0% · 3.4 MB/s','st-active',31)}${xrow('setup-0.7.3.exe','Completed · 74 MB','st-done',0)}
  <div style="display:flex;gap:8px;padding:10px 12px">${bt('Open Inbound')}${bt('Options',{i:'sliders'})}</div></div>
  <div class="x" style="max-width:380px;align-self:flex-start"><h2>Left out on purpose</h2><p>Browsing a site, uploads and remote changes need room and care that a popup does not have. The extension's job stays catching browser downloads.</p><p style="margin:0">If the line is too much, the extension is simply out of scope for Sites.</p></div></div>`};

/* engine */
const winEl=document.getElementById('win'),rail=document.getElementById('rail'),notes=document.getElementById('notes');
let cur='overview';
function buildRail(){let last='',h='';Object.keys(S).forEach(k=>{const s=S[k];if(s.g!==last){h+=`<div class="rg">${s.g}</div>`;last=s.g}
  h+=`<button class="ri ${k===cur?'on':''}" type="button" data-go="${k}"><b style="font-weight:600;font-size:14px">${s.l}</b><span>${s.d}</span></button>`;});rail.innerHTML=h;}
function show(id){if(!S[id])id='overview';cur=id;winEl.innerHTML=S[id].r();const n=S[id].notes;
  notes.innerHTML=`<div class="note"><h4>What you see</h4><p>${n[0]}</p></div><div class="note"><h4>How it works</h4><p>${n[1]}</p></div><div class="note q"><h4>To check or decide</h4><p>${n[2]}</p></div>`;
  buildRail();try{history.replaceState(null,'','#'+id)}catch(e){}}
document.addEventListener('click',e=>{
  const r=e.target.closest('.rd');
  if(r){const grp=r.getAttribute('data-grp');winEl.querySelectorAll('.rd[data-grp="'+grp+'"] i').forEach(i=>i.classList.remove('on'));r.querySelector('i').classList.add('on');return}
  const c=e.target.closest('.cb');
  if(c&&!c.closest('.phone')){const i=c.querySelector('i');const on=!i.classList.contains('on');i.classList.toggle('on',on);i.innerHTML=on?ic('check'):'';return}
  const g=e.target.closest('[data-go]');
  if(g){show(g.getAttribute('data-go'));return}
  const row=e.target.closest('.lr');
  if(row&&row.closest('.panes3')){row.classList.toggle('sel')}
});
const tbtn=document.getElementById('themebtn');
let tm='system';
try{tm=localStorage.getItem('inb-theme')||'system'}catch(e){}
function applyTheme(){const r=document.documentElement;if(tm==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',tm);tbtn.textContent='Theme: '+tm;try{localStorage.setItem('inb-theme',tm)}catch(e){}}
tbtn.addEventListener('click',()=>{tm=tm==='system'?'dark':tm==='dark'?'light':'system';applyTheme()});
applyTheme();
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'overview');

</script>
