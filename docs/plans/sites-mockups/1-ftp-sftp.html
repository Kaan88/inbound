<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inbound Sites Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a situation list on the left, one WinUI-styled Inbound window on the right, notes underneath. Palette = App.xaml Inbound tokens. */
:root{
--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
--page:#E6E6E6;--panel:#F4F4F4;--text:#1A1A1A;--sec:#666666;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--page:#101010;--panel:#1A1A1A;--text:#FFFFFF;--sec:#A3A3A3;
--win:#202020;--chrome:rgba(255,255,255,.031);--surface:#181818;--divider:#343434;--fill:#4AA3F0;--on-acc:#0B1A2A;--upload:#F0A35E;--track:#383838;--hl:#2B3A4F;--sel:rgba(255,255,255,.094);--card:rgba(255,255,255,.05);--cardstroke:rgba(255,255,255,.08);--ctl:rgba(255,255,255,.06);--ctl-stroke:rgba(255,255,255,.1);--dlg:#2B2B2B;
--active:#6DB3F2;--done:#5DC879;--failed:#F58B8B;--wait:#E0A93E;--neutral:#A3A3A3;
--i-start:#8CCF8C;--i-pause:#E8B36A;--i-danger:#E08A8A;--i-info:#6FA8DC;--i-neutral:#A8A8A8;--i-media:#B49AD6;color-scheme:dark}}
:root[data-theme="dark"]{
--page:#101010;--panel:#1A1A1A;--text:#FFFFFF;--sec:#A3A3A3;
--win:#202020;--chrome:rgba(255,255,255,.031);--surface:#181818;--divider:#343434;--fill:#4AA3F0;--on-acc:#0B1A2A;--upload:#F0A35E;--track:#383838;--hl:#2B3A4F;--sel:rgba(255,255,255,.094);--card:rgba(255,255,255,.05);--cardstroke:rgba(255,255,255,.08);--ctl:rgba(255,255,255,.06);--ctl-stroke:rgba(255,255,255,.1);--dlg:#2B2B2B;
--active:#6DB3F2;--done:#5DC879;--failed:#F58B8B;--wait:#E0A93E;--neutral:#A3A3A3;
--i-start:#8CCF8C;--i-pause:#E8B36A;--i-danger:#E08A8A;--i-info:#6FA8DC;--i-neutral:#A8A8A8;--i-media:#B49AD6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--text);font:14px/1.5 var(--font);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto}
.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.top p{margin:0;color:var(--sec);max-width:64ch}
.themebtn{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--ctl-stroke);background:var(--panel);cursor:pointer}
.layout{display:grid;grid-template-columns:238px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
#rail{display:flex;flex-direction:column;gap:2px}
@media (max-width:1100px){#rail{flex-direction:row;flex-wrap:wrap;gap:6px}}
.rg{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--sec);padding:12px 10px 4px}
@media (max-width:1100px){.rg{width:100%;padding:6px 2px 0}}
.ri{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 10px;cursor:pointer;position:relative}
.ri span{font-size:12px;color:var(--sec)}
.ri:hover{background:var(--panel)}
.ri.on{background:var(--hl)}
.ri.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--fill)}
@media (max-width:1100px){.ri{border-color:var(--divider)}.ri span{display:none}}
.ri:focus-visible,.themebtn:focus-visible{outline:2px solid var(--fill);outline-offset:1px}
.stage{overflow-x:auto;padding-bottom:4px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.note{background:var(--panel);border:1px solid var(--divider);border-radius:8px;padding:12px 14px}
.note h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--sec);letter-spacing:.03em}
.note p{margin:0;font-size:13.5px;line-height:1.5}
.note.q{border-color:var(--fill)}

/* the mock window */
.win{min-width:1100px;position:relative;overflow:hidden;background:var(--win);color:var(--text);border:1px solid var(--divider);border-radius:8px;font:12px/1.35 var(--font)}
.win svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grow{flex:1}
.title{height:32px;display:flex;align-items:center;gap:8px;padding-left:12px}
.title .app{color:var(--fill);display:grid}
.wc{margin-left:auto;display:flex}
.wc b{width:46px;height:32px;display:grid;place-items:center;font-weight:400}
.menubar{height:28px;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--chrome);border-bottom:1px solid var(--divider)}
.menubar b{font-weight:400;padding:3px 10px;border-radius:4px}
.toolbar{height:62px;display:flex;align-items:stretch;padding:2px 6px;background:var(--chrome);border-bottom:1px solid var(--divider);overflow:hidden}
.tb{min-width:72px;padding:0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.tb svg.ic{width:22px;height:22px}
.tsep{width:1px;background:var(--divider);margin:8px 4px}
.c-start{color:var(--i-start)}.c-pause{color:var(--i-pause)}.c-danger{color:var(--i-danger)}.c-info{color:var(--i-info)}.c-neutral{color:var(--i-neutral)}.c-media{color:var(--i-media)}
.body{display:grid;grid-template-columns:190px minmax(0,1fr)}
.side{background:var(--chrome);border-right:1px solid var(--divider);padding:6px 0 12px;min-height:470px}
.sh{padding:12px 12px 4px;color:var(--sec);font-weight:600;font-size:11px}
.si{position:relative;display:flex;align-items:center;gap:8px;height:30px;margin:1px 4px;padding:0 8px;border-radius:4px}
.si.on{background:var(--sel)}
.si.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--fill)}
.si .n{margin-left:auto;color:var(--sec)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--neutral)}
.dot.on{background:var(--done);border-color:var(--done)}.dot.busy{background:var(--wait);border-color:var(--wait)}.dot.lost{background:var(--failed);border-color:var(--failed)}
.main{min-width:0;padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--cardstroke);border-radius:8px;overflow:hidden;min-width:0}
.tile{background:var(--card);border:1px solid var(--cardstroke);border-radius:8px;padding:10px 12px}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--chrome);border-bottom:1px solid var(--divider)}
.ph b{font-weight:600}
.chipn{border:1px solid var(--divider);border-radius:10px;padding:0 8px;color:var(--sec);font-size:11px;line-height:18px}
.chipn.warn{color:var(--wait);border-color:var(--wait)}.chipn.ok{color:var(--done);border-color:var(--done)}.chipn.bad{color:var(--failed);border-color:var(--failed)}
.pp{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--divider)}
.ib{width:28px;height:26px;display:grid;place-items:center;border-radius:4px;border:1px solid var(--ctl-stroke);background:var(--ctl);cursor:pointer;color:var(--i-neutral)}
.pathbox{flex:1;min-width:0;height:26px;display:flex;align-items:center;padding:0 8px;border:1px solid var(--ctl-stroke);border-radius:4px;background:var(--ctl);font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.filter{width:120px;height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--ctl-stroke);border-radius:4px;background:var(--ctl);color:var(--sec)}
.filter.has{color:var(--text);width:150px}
.lh,.lr{display:grid;grid-template-columns:var(--cols);align-items:center;padding:0 10px;gap:8px}
.lh{height:26px;background:var(--chrome);border-bottom:1px solid var(--divider);font-weight:600}
.lr{height:27px;position:relative;white-space:nowrap}
.lr>*{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lr .nm{display:flex;align-items:center;gap:7px}
.lr .nm span{overflow:hidden;text-overflow:ellipsis}
.lr.sel{background:var(--hl)}
.lr.sel::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--fill)}
.lr:not(.sel):hover{background:var(--sel)}
.lr .r{text-align:right}.sec{color:var(--sec)}
.lr.stale{color:var(--sec)}
.foot{padding:6px 10px;border-top:1px solid var(--divider);color:var(--sec);background:var(--chrome)}
.st-active{color:var(--active)}.st-done{color:var(--done)}.st-failed{color:var(--failed)}.st-wait{color:var(--wait)}.st-neutral{color:var(--neutral)}
.stc{display:flex;flex-direction:column;gap:2px;justify-content:center;min-width:0}
.stc>span{line-height:13px;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--fill)}
.bar.up i{background:var(--upload)}.bar.wait i{background:var(--wait)}
.qt{display:flex;gap:10px;align-items:center;padding:7px 10px;background:var(--chrome);border-bottom:1px solid var(--divider)}
.qt b{font-weight:600}.qt span{color:var(--sec)}
.dirI{color:var(--i-pause)}.fileI{color:var(--i-neutral)}.linkI{color:var(--i-info)}
.down{color:var(--fill)}.upc{color:var(--upload)}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:var(--sec);min-height:190px}
.state svg.ic{width:32px;height:32px}
.state .t{color:var(--text);font-size:14px;font-weight:600}
.ring{width:28px;height:28px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--fill);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.steps{display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;color:var(--text)}
.steps div{display:flex;gap:8px;align-items:center}
.steps .todo{color:var(--sec)}
.info{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:4px;border:1px solid var(--cardstroke);background:var(--card)}
.info.inf{background:var(--hl)}
.info .ii{display:grid}
.info.warn .ii{color:var(--wait)}.info.err .ii{color:var(--failed)}.info.ok .ii{color:var(--done)}.info.inf .ii{color:var(--fill)}
.info .tx{flex:1;min-width:0}.info .tx b{font-weight:600}
.b{height:28px;padding:0 12px;border-radius:4px;border:1px solid var(--ctl-stroke);background:var(--ctl);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.b.acc{background:var(--fill);color:var(--on-acc);border-color:transparent}
.b.dng{color:var(--i-danger)}
.b:focus-visible{outline:2px solid var(--fill);outline-offset:1px}
.gbar{height:23px;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--chrome);border-top:1px solid var(--divider);color:var(--sec)}
.sbar{height:24px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--chrome);border-top:1px solid var(--divider)}
.scrim{position:absolute;inset:32px 0 0 0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:5;padding:16px}
.dlg{width:min(500px,100%);background:var(--dlg);border:1px solid var(--divider);border-radius:8px;overflow:hidden}
.dh{padding:20px 22px 18px}
.dh h3{margin:0 0 10px;font-size:18px;font-weight:600;display:flex;gap:10px;align-items:center}
.dh p{margin:0 0 10px;font-size:13px;line-height:1.45}
.df{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;background:var(--chrome);border-top:1px solid var(--divider)}
.df .b{min-width:96px;justify-content:center}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px}
.fp{background:var(--card);border:1px solid var(--cardstroke);border-radius:4px;padding:7px 10px;word-break:break-all;margin:4px 0 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px;margin-bottom:8px}
.kv span:nth-child(odd){color:var(--sec)}
.rd,.cb{display:flex;gap:10px;align-items:flex-start;margin:7px 0;font-size:13px;cursor:pointer}
.rd i{width:18px;height:18px;border-radius:50%;border:1px solid var(--sec);flex:none;margin-top:1px;position:relative}
.rd i.on{border-color:var(--fill)}.rd i.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--fill)}
.cb i{width:18px;height:18px;border-radius:4px;border:1px solid var(--sec);flex:none;margin-top:1px;display:grid;place-items:center;color:var(--on-acc)}
.cb i.on{background:var(--fill);border-color:var(--fill)}
.cb svg.ic{width:13px!important;height:13px!important;stroke-width:2.4}
.sel2{display:inline-flex;gap:2px;padding:2px;border-radius:6px;background:var(--card);border:1px solid var(--cardstroke);margin-bottom:12px}
.sel2 b{font-weight:400;padding:3px 12px;border-radius:4px;cursor:pointer}
.sel2 b.on{background:var(--sel);font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label{color:var(--sec);font-size:12px}
.in{height:28px;width:100%;border:1px solid var(--ctl-stroke);border-radius:4px;background:var(--ctl);color:var(--text);font:inherit;padding:0 8px}
select.in{padding-right:4px}
.in:focus-visible{outline:2px solid var(--fill);outline-offset:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.w2{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:700px;max-width:96%;background:var(--win);border:1px solid var(--divider);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:6}
.w2 .title{background:var(--win)}
.mgr{display:grid;grid-template-columns:200px minmax(0,1fr)}
.mgr .tree{border-right:1px solid var(--divider);padding:8px 0;background:var(--chrome);min-height:420px}
.mgr .form{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.menu{position:absolute;width:210px;background:var(--dlg);border:1px solid var(--divider);border-radius:8px;padding:4px;z-index:4;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.menu div{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:4px;cursor:pointer}
.menu div:hover,.menu div.h{background:var(--sel)}
.menu hr{border:0;border-top:1px solid var(--divider);margin:4px 2px}
.drop{outline:2px dashed var(--fill);outline-offset:-4px;background:var(--hl)}
.ghost{position:absolute;z-index:3;background:var(--dlg);border:1px solid var(--fill);border-radius:4px;padding:5px 10px;display:flex;gap:8px;align-items:center}
.seg{display:flex;height:14px;border-radius:2px;overflow:hidden;gap:2px}
.seg div{flex:1;background:var(--track);position:relative}.seg div i{position:absolute;inset:0 auto 0 0;background:var(--fill)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles .tile small{display:block;color:var(--sec);font-size:12px}.tiles .tile b{font-size:18px;font-weight:600}.tiles .tile b u{text-decoration:none;font-size:12px;font-weight:400;color:var(--sec)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Sites in Inbound</h1>
      <p>FTP, FTPS and SFTP as saved sites you connect to and browse, with every transfer landing in the list you already have. Mockups only; nothing here is built.</p>
    </div>
    <button class="themebtn" id="themebtn" type="button">Theme: system</button>
  </header>
  <div class="layout">
    <nav id="rail" aria-label="Situations"></nav>
    <div>
      <div class="stage"><div id="win"></div></div>
      <section class="notes" id="notes" aria-live="polite"></section>
    </div>
  </div>
</div>

function pane(o){

/* engine */
const winEl=document.getElementById('win'),rail=document.getElementById('rail'),notes=document.getElementById('notes');
let cur='browse';
function buildRail(){
  let last='',h='';
  Object.keys(S).forEach(k=>{
    const s=S[k];
    if(s.g!==last){h+=`<div class="rg">${s.g}</div>`;last=s.g}
    h+=`<button class="ri ${k===cur?'on':''}" type="button" data-go="${k}"><b style="font-weight:600;font-size:14px">${s.l}</b><span>${s.d}</span></button>`;
  });
  rail.innerHTML=h;
}
function show(id){
  if(!S[id])id='browse';
  cur=id;
  if(id==='manager'){mgr.tested=false}
  winEl.innerHTML=S[id].r();
  const n=S[id].notes;
  notes.innerHTML=`<div class="note"><h4>What you see</h4><p>${n[0]}</p></div><div class="note"><h4>What the Host does</h4><p>${n[1]}</p></div><div class="note q"><h4>To decide</h4><p>${n[2]}</p></div>`;
  buildRail();
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){show(g.getAttribute('data-go'));return}
  const tv=e.target.closest('[data-tv]');
  if(tv){trustV=tv.getAttribute('data-tv');show('trust');return}
  const r=e.target.closest('.rd');
  if(r){const grp=r.getAttribute('data-grp');winEl.querySelectorAll('.rd[data-grp="'+grp+'"] i').forEach(i=>i.classList.remove('on'));r.querySelector('i').classList.add('on');return}
  const c=e.target.closest('.cb');
  if(c){const i=c.querySelector('i');const on=!i.classList.contains('on');i.classList.toggle('on',on);i.innerHTML=on?ic('check'):'';return}
  const row=e.target.closest('.lr');
  if(row&&row.closest('.panes')){row.classList.toggle('sel');return}
  const tst=e.target.closest('.w2 .df .b');
  if(tst&&tst.textContent.trim()==='Test connection'){mgr.tested=true;winEl.innerHTML=S.manager.r();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='proto'){mgr.proto=e.target.value;mgr.tested=false;winEl.innerHTML=S.manager.r()}
  if(e.target.id==='logon'){mgr.logon=e.target.value;mgr.tested=false;winEl.innerHTML=S.manager.r()}
  if(e.target.id==='enc'){mgr.enc=e.target.selectedIndex;winEl.innerHTML=S.manager.r()}
});
const tbtn=document.getElementById('themebtn');
let tm='system';
try{tm=localStorage.getItem('inb-theme')||'system'}catch(e){}
function applyTheme(){
  const r=document.documentElement;
  if(tm==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',tm);
  tbtn.textContent='Theme: '+tm;
  try{localStorage.setItem('inb-theme',tm)}catch(e){}
}
tbtn.addEventListener('click',()=>{tm=tm==='system'?'dark':tm==='dark'?'light':'system';applyTheme()});
applyTheme();
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'browse');
</script>
