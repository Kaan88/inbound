# Builds Inbound.app for macOS (Apple Silicon and Intel) as a .zip and a .dmg, kept as run artifacts for 14 days.
# Nothing is signed with a Developer ID, notarized, or attached to a release: see scripts/package-macos.sh.
#
# - On a push to a macos-* branch, or by hand on any branch.
# - The torrent worker (native/torrent-worker, libtorrent through vcpkg) is built first; if that step fails the app is
#   still packed, with torrents turned off, so the rest of the macOS build can be tried.
# Actions are pinned to the commit of the release named beside each.
name: macOS packages

on:
  push:
    branches: ["macos-*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    if: github.repository == 'Kaan88/inbound'
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_COMMIT: e54ef0fcc9a82033a61e51002552a910a5d57282
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $GITHUB_REF_NAME as $version for ${{ matrix.rid }}"

      - name: .NET SDK 10
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version

      - name: vcpkg packages cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.rid }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/torrent-worker/vcpkg.json', 'native/torrent-worker/ports/**', 'native/torrent-worker/triplets/*osx*') }}

      - name: Torrent worker (libtorrent, vcpkg)
        id: worker
        continue-on-error: true
        working-directory: native/torrent-worker
        run: |
          case "${{ matrix.rid }}" in osx-arm64) triplet=arm64-osx-static-rel; arch=arm64 ;; *) triplet=x64-osx-static-rel; arch=x86_64 ;; esac
          brew list ninja >/dev/null 2>&1 || brew install ninja
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          cmake -S . -B "$RUNNER_TEMP/worker" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=$triplet -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DCMAKE_OSX_ARCHITECTURES=$arch -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build "$RUNNER_TEMP/worker" --parallel
          if [ "${{ matrix.rid }}" = osx-arm64 ]; then
            "$RUNNER_TEMP/worker/inbound-torrent-selftest"
            "$RUNNER_TEMP/worker/inbound-torrent" --version
          fi
          strip "$RUNNER_TEMP/worker/inbound-torrent"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/torrent-worker/${{ matrix.rid }}"
          cp "$RUNNER_TEMP/worker/inbound-torrent" "$GITHUB_WORKSPACE/artifacts/torrent-worker/${{ matrix.rid }}/"
          file "$GITHUB_WORKSPACE/artifacts/torrent-worker/${{ matrix.rid }}/inbound-torrent"

      - name: Upload the vcpkg logs when the worker failed
        if: steps.worker.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-logs-${{ matrix.rid }}
          path: ${{ runner.temp }}/vcpkg/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Inbound.app, the .zip and the .dmg
        run: bash scripts/package-macos.sh ${{ matrix.rid }}

      - name: The Host and the CLI start (arm64)
        if: matrix.rid == 'osx-arm64'
        run: |
          set +e
          app="artifacts/macos/arm64/Inbound.app"
          "$app/Contents/MacOS/InboundLauncher" --cli --version
          export DOWNLOADMANAGER_DATA="$RUNNER_TEMP/inbound-data"
          "$app/Contents/Resources/host/inbound-host" --background > "$RUNNER_TEMP/host.log" 2>&1 &
          pid=$!
          ok=1
          for i in $(seq 1 60); do
            if "$app/Contents/Resources/host/DownloadManager.Cli" list --no-start >/dev/null 2>&1; then ok=0; break; fi
            kill -0 $pid 2>/dev/null || { echo "The Host exited: $(wait $pid; echo $?)"; break; }
            sleep 1
          done
          "$app/Contents/Resources/host/DownloadManager.Cli" list --no-start
          echo "--- Host output"; cat "$RUNNER_TEMP/host.log"
          echo "--- Host logs"; find "$DOWNLOADMANAGER_DATA" -maxdepth 2 | head -40; cat "$DOWNLOADMANAGER_DATA"/logs/* 2>/dev/null | tail -80
          echo "--- sockets"; ls -la "${TMPDIR:-/tmp}"/inbound-* 2>/dev/null
          kill $pid 2>/dev/null
          exit $ok

      - name: The window draws and its dialogs close (arm64; screenshots and trace in the log)
        if: matrix.rid == 'osx-arm64'
        continue-on-error: true
        run: |
          set +e
          app="artifacts/macos/arm64/Inbound.app"
          host="$app/Contents/Resources/host"
          data="$RUNNER_TEMP/inbound-ui"
          trace="$data/logs/ui-trace.log"
          shot() {
            screencapture -x "$RUNNER_TEMP/$1.png"
            sips -Z 1200 -s format jpeg -s formatOptions 70 "$RUNNER_TEMP/$1.png" --out "$RUNNER_TEMP/$1.jpg" >/dev/null
            echo "SCREENSHOT-$1-BEGIN"; base64 -i "$RUNNER_TEMP/$1.jpg" | fold -w 1000; echo "SCREENSHOT-$1-END"
          }
          brew install cliclick >/dev/null 2>&1
          dotnet tool install -g dotnet-dump >/dev/null 2>&1; export PATH="$PATH:$HOME/.dotnet/tools"

          # The Host with one download (it fails at once: nothing listens on port 9), so Progress Details has one to show.
          DOWNLOADMANAGER_DATA="$data" "$host/inbound-host" --background > "$RUNNER_TEMP/host.log" 2>&1 &
          for i in $(seq 1 30); do DOWNLOADMANAGER_DATA="$data" "$host/DownloadManager.Cli" list --no-start >/dev/null 2>&1 && break; sleep 1; done
          DOWNLOADMANAGER_DATA="$data" "$host/DownloadManager.Cli" add http://127.0.0.1:9/selftest.bin --dest "$RUNNER_TEMP" --no-start
          echo "--- host log"; cat "$data"/logs/host-*.log | cut -c1-200 | grep -i -E 'menu|tray|ready' 

          # Through LaunchServices, as Finder starts it, so the window runs with the bundle's identity.
          # DOWNLOADMANAGER_UNO_SELFTEST: About, Progress Details and Options open and close (MainWindow.UnoSelfTest.cs).
          open -n --env DOWNLOADMANAGER_DATA="$data" --env DOWNLOADMANAGER_UNO_TRACE=1 \
            --env DOWNLOADMANAGER_UNO_SELFTEST=1 --stdout "$RUNNER_TEMP/ui.log" --stderr "$RUNNER_TEMP/ui.log" "$app"
          for i in $(seq 1 40); do grep -q 'selftest: opening About' "$trace" 2>/dev/null && break; sleep 1; done
          shot main
          clicked=""
          for i in $(seq 1 60); do
            # Each "click ... at x,y" line once: as a user would, on the point the window gave.
            grep -o 'selftest: click .* at [0-9-]*,[0-9-]*' "$trace" 2>/dev/null | while read -r line; do
              case "$clicked" in *"$line"*) continue ;; esac
              point="${line##* at }"
              echo "clicking: $line"
              case "$line" in *About*) shot about ;; *"Progress Details close"*) shot progress ;; esac
              cliclick "m:$point" "w:200" "c:$point"
            done
            clicked="$(grep -o 'selftest: click .* at [0-9-]*,[0-9-]*' "$trace" 2>/dev/null)"
            grep -q 'selftest: click main close' "$trace" && [ -n "$(echo "$clicked" | grep 'main close')" ] && break
            sleep 0.5
          done
          # The main window was closed by its button (the self-test's last click): its process should end.
          sleep 6; shot closed
          pid="$(pgrep -f 'Resources/window/DownloadManager.Desktop.Uno' | head -n1)"
          last="$(grep 'selftest heartbeat' "$trace" | tail -n1)"
          echo "--- after closing the main window: last heartbeat: $last"
          if [ -n "$pid" ]; then
            echo "--- the window process $pid is still running after its window closed: managed stacks of every thread"
            dotnet-dump collect -p "$pid" -o "$RUNNER_TEMP/ui.dmp" --type Mini >/dev/null 2>&1
            dotnet-dump analyze "$RUNNER_TEMP/ui.dmp" -c "clrstack -all" -c exit 2>&1 | head -400
          else
            echo "--- the window process ended after its window closed"
          fi

          # Opened again as the menu-bar icon's Open Inbound does now (LinuxHostPlatform.LaunchUi on macOS).
          open -n -a "$PWD/$app" --env DOWNLOADMANAGER_DATA="$data" --env DOWNLOADMANAGER_UNO_TRACE=1
          sleep 12; shot reopened
          echo "--- window processes now: $(pgrep -fl 'DownloadManager.Desktop.Uno' | wc -l)"
          echo "--- menu-bar helper: $(pgrep -fl inbound-menu || echo 'not running')"
          echo "--- window output"; tail -40 "$RUNNER_TEMP/ui.log"
          echo "--- ui trace"; grep -v -E 'first chance|selftest heartbeat' "$trace" | tail -40
          echo "--- heartbeats"; grep 'selftest heartbeat' "$trace" | awk 'NR%4==1' | cut -c12-220
          echo "--- first-chance exceptions"; grep 'first chance' "$trace" | cut -c1-300 | sort | uniq -c | sort -rn | head -20
          pkill -f DownloadManager.Desktop.Uno; pkill -f inbound-host
          exit 0

      - name: Keep them as run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.rid }}-${{ env.VERSION }}
          path: |
            artifacts/macos/*.zip
            artifacts/macos/*.dmg
            artifacts/macos/SHA256SUMS-macos-*
          retention-days: 14
