# Builds Inbound.app for macOS (Apple Silicon and Intel) as a .zip and a .dmg, kept as run artifacts for 14 days.
# Nothing is signed with a Developer ID, notarized, or attached to a release: see scripts/package-macos.sh.
#
# - On a push to a macos-* branch, or by hand on any branch.
# - The torrent worker (native/torrent-worker, libtorrent through vcpkg) is built first; if that step fails the app is
#   still packed, with torrents turned off, so the rest of the macOS build can be tried.
# Actions are pinned to the commit of the release named beside each.
name: macOS packages

on:
  push:
    branches: ["macos-*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    if: github.repository == 'Kaan88/inbound'
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_COMMIT: e54ef0fcc9a82033a61e51002552a910a5d57282
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $GITHUB_REF_NAME as $version for ${{ matrix.rid }}"

      - name: .NET SDK 10
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version

      - name: vcpkg packages cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.rid }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/torrent-worker/vcpkg.json', 'native/torrent-worker/ports/**', 'native/torrent-worker/triplets/*osx*') }}

      - name: Torrent worker (libtorrent, vcpkg)
        id: worker
        continue-on-error: true
        working-directory: native/torrent-worker
        run: |
          case "${{ matrix.rid }}" in osx-arm64) triplet=arm64-osx-static-rel; arch=arm64 ;; *) triplet=x64-osx-static-rel; arch=x86_64 ;; esac
          brew list ninja >/dev/null 2>&1 || brew install ninja
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          cmake -S . -B "$RUNNER_TEMP/worker" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=$triplet -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DCMAKE_OSX_ARCHITECTURES=$arch -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build "$RUNNER_TEMP/worker" --parallel
          if [ "${{ matrix.rid }}" = osx-arm64 ]; then
            "$RUNNER_TEMP/worker/inbound-torrent-selftest"
            "$RUNNER_TEMP/worker/inbound-torrent" --version
          fi
          strip "$RUNNER_TEMP/worker/inbound-torrent"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/torrent-worker/${{ matrix.rid }}"
          cp "$RUNNER_TEMP/worker/inbound-torrent" "$GITHUB_WORKSPACE/artifacts/torrent-worker/${{ matrix.rid }}/"
          file "$GITHUB_WORKSPACE/artifacts/torrent-worker/${{ matrix.rid }}/inbound-torrent"

      - name: Upload the vcpkg logs when the worker failed
        if: steps.worker.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-logs-${{ matrix.rid }}
          path: ${{ runner.temp }}/vcpkg/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Inbound.app, the .zip and the .dmg
        run: bash scripts/package-macos.sh ${{ matrix.rid }}

      - name: The Host and the CLI start (arm64)
        if: matrix.rid == 'osx-arm64'
        run: |
          set +e
          app="artifacts/macos/arm64/Inbound.app"
          "$app/Contents/MacOS/InboundLauncher" --cli --version
          export DOWNLOADMANAGER_DATA="$RUNNER_TEMP/inbound-data"
          "$app/Contents/Resources/host/inbound-host" --background > "$RUNNER_TEMP/host.log" 2>&1 &
          pid=$!
          ok=1
          for i in $(seq 1 60); do
            if "$app/Contents/Resources/host/DownloadManager.Cli" list --no-start >/dev/null 2>&1; then ok=0; break; fi
            kill -0 $pid 2>/dev/null || { echo "The Host exited: $(wait $pid; echo $?)"; break; }
            sleep 1
          done
          "$app/Contents/Resources/host/DownloadManager.Cli" list --no-start
          echo "--- Host output"; cat "$RUNNER_TEMP/host.log"
          echo "--- Host logs"; find "$DOWNLOADMANAGER_DATA" -maxdepth 2 | head -40; cat "$DOWNLOADMANAGER_DATA"/logs/* 2>/dev/null | tail -80
          echo "--- sockets"; ls -la "${TMPDIR:-/tmp}"/inbound-* 2>/dev/null
          kill $pid 2>/dev/null
          exit $ok

      - name: The window draws (arm64; screenshot in the log)
        if: matrix.rid == 'osx-arm64'
        continue-on-error: true
        run: |
          set +e
          app="artifacts/macos/arm64/Inbound.app"
          echo "--- fonts in the bundle"; find "$app" -iname '*.ttf' -o -iname '*.otf' | sed "s|$app/||"
          export DOWNLOADMANAGER_DATA="$RUNNER_TEMP/inbound-ui"
          export DOWNLOADMANAGER_UNO_TRACE=1
          # Through LaunchServices, as Finder starts it, so the window runs with the bundle's identity.
          open -n --env DOWNLOADMANAGER_DATA="$DOWNLOADMANAGER_DATA" --env DOWNLOADMANAGER_UNO_TRACE=1 \
            --stdout "$RUNNER_TEMP/ui.log" --stderr "$RUNNER_TEMP/ui.log" "$app"
          sleep 20
          screencapture -x "$RUNNER_TEMP/shot1.png"
          sips -Z 1200 -s format jpeg -s formatOptions 70 "$RUNNER_TEMP/shot1.png" --out "$RUNNER_TEMP/shot1.jpg" >/dev/null
          echo "SCREENSHOT1-BEGIN"; base64 -i "$RUNNER_TEMP/shot1.jpg" | fold -w 1000; echo "SCREENSHOT1-END"
          # Frames drawn over each other show here as a brighter or smeared second screenshot.
          sleep 25
          screencapture -x "$RUNNER_TEMP/shot.png"
          sips -Z 1200 -s format jpeg -s formatOptions 70 "$RUNNER_TEMP/shot.png" --out "$RUNNER_TEMP/shot.jpg" >/dev/null
          echo "--- window output"; tail -40 "$RUNNER_TEMP/ui.log"
          echo "--- ui trace"; grep -v 'first chance' "$DOWNLOADMANAGER_DATA/logs/ui-trace.log" | tail -40
          echo "--- first-chance exceptions"; grep 'first chance' "$DOWNLOADMANAGER_DATA/logs/ui-trace.log" | cut -c1-300 | sort | uniq -c | sort -rn | head -20
          echo "SCREENSHOT-BEGIN"; base64 -i "$RUNNER_TEMP/shot.jpg" | fold -w 1000; echo "SCREENSHOT-END"
          pkill -f DownloadManager.Desktop.Uno; pkill -f inbound-host
          exit 0

      - name: Keep them as run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.rid }}-${{ env.VERSION }}
          path: |
            artifacts/macos/*.zip
            artifacts/macos/*.dmg
            artifacts/macos/SHA256SUMS-macos-*
          retention-days: 14
