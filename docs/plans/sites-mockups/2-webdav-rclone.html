function rcMgr(){
  const remotes={'gdrive':['drive','Google Drive'],'b2-media':['b2','Backblaze B2'],'vault':['crypt','crypt over b2-media:encrypted'],'onedrive-work':['onedrive','Microsoft OneDrive']};
  const cur=remotes[M.rmote];
  const opts=Object.keys(remotes).map(k=>`<option ${k===M.rmote?'selected':''}>${k}</option>`).join('');
  const tree=`<div class="tree"><div class="si"><span class="sec">${ic('folder')}</span><span>Sites</span></div>
  <div class="si" style="margin-left:22px">${ic('server')}<span>nas.home.lan</span></div>
  <div class="si" style="margin-left:22px">${ic('cloud')}<span>cloud.example.net</span></div>
  <div class="si"><span class="sec">${ic('folder')}</span><span>rclone remotes</span></div>
  <div class="si on" style="margin-left:22px">${ic('cloud')}<span>${M.rmote}</span></div>
  <div style="display:flex;gap:6px;padding:12px 8px;flex-wrap:wrap">${bt('Refresh remotes',{i:'refresh'})}</div></div>`;
  const form=`<div class="form"><div class="g2"><div class="fld"><label>Protocol</label><input class="in" value="rclone remote" readonly></div><div class="fld"><label for="rmote">Remote</label><select class="in" id="rmote">${opts}</select></div></div>
  <div class="g2"><div class="fld"><label>Type</label><input class="in" value="${cur[0]}" readonly></div><div class="fld"><label>Name in rclone.conf</label><input class="in mono" value="${M.rmote}:" readonly></div></div>
  <div class="fld"><label>Folder in the remote</label><input class="in" value="/Projects/2026" readonly></div>
  <div class="fld"><label>Default local folder</label><input class="in" value="D:\\Downloads\\Renders" readonly></div>
  <div class="g2"><div class="fld"><label>Simultaneous transfers</label><input class="in" value="3" readonly></div><div class="fld"><label>Connections per file</label><input class="in" value="4" readonly></div></div>
  ${M.tested?info('ok','Connected.',M.rmote==='vault'?'Names decrypt. 31 items in the folder.':'rclone 1.68.2 · ranges supported · 31 items in the folder.'):info('inf','',M.rmote==='vault'?cur[1]+'. Names and contents are decrypted when listed.':cur[1]+'. Its sign-in lives in rclone.conf and is managed by rclone.')}
  <div style="display:flex;gap:8px">${bt('Edit in rclone…',{i:'external'})}</div></div>`;
  return sec('Site Manager','cloud',`<div class="mgr">${tree}${form}</div>`,`${bt('Test connection',{i:'plug'})}<span class="grow"></span>${bt('Save')}${bt('Connect',{acc:1,go:'rc-browse'})}${bt('Cancel',{go:'rc-browse'})}`,700);
}

function ar(x1,x2,y,l){return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="stroke:var(--sec);stroke-width:1.5" marker-end="url(#ar)"/><text x="${(x1+x2)/2}" y="${y-8}" text-anchor="middle" style="font-size:12px;fill:var(--sec)">${l}</text>`}

S['rc-modes']={g:'How rclone moves bytes',l:'Two modes',d:'Who moves the bytes',
 notes:['The two ways rclone can be used, and what each keeps of Inbound\'s own behavior. The blue outline marks the part that moves the bytes.','Through rclone is the default: rclone is only a protocol adapter and Inbound\'s engine writes the part file. In rclone transfers, rclone writes the file.','Offer rclone transfers at all? It breaks the rule that the part file lives next to the destination, so I would leave it out unless you want it.'],
 r:()=>`<div class="x"><h2>Who moves the bytes</h2><p>Both modes reach the same remotes. They differ in which program reads the data and writes the file.</p>
 <svg viewBox="0 0 1040 322" width="100%" role="img" aria-labelledby="t1 d1"><title id="t1">Two ways rclone can move bytes</title><desc id="d1">In the first, the Inbound Host reads from rclone serve over local HTTP and rclone talks to the remote. In the second, the Host asks rclone to copy and rclone writes the file itself.</desc>
 <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--sec)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
 <text x="20" y="26" style="font-size:14px;font-weight:600;fill:var(--text)">Inbound downloads through rclone</text>
 ${bx(20,40,230,'Inbound Host','Queue, segments, limits',1)}${ar(250,398,76,'HTTP, range reads')}${bx(400,40,230,'rclone serve','This PC only, random password')}${ar(630,778,76,'provider protocol')}${bx(780,40,240,'Your remote','Drive, S3, B2, crypt')}
 <text x="20" y="176" style="font-size:14px;font-weight:600;fill:var(--text)">rclone does the transfer</text>
 ${bx(20,190,230,'Inbound Host','Queue and progress')}${ar(250,398,226,'start, ask for progress')}${bx(400,190,230,'rclone rc','Copies the file itself',1)}${ar(630,778,226,'provider protocol')}${bx(780,190,240,'Your remote','Drive, S3, B2, crypt')}
 <text x="20" y="306" style="font-size:12px;fill:var(--sec)">Blue outline: the part that moves the bytes and writes the file.</text></svg>
 <table class="cmp"><tr><th>What you get</th><th>Inbound downloads through rclone</th><th>rclone does the transfer</th></tr>
 <tr><td>Several connections per file</td><td>${yes('Yes')}, when the remote can read ranges</td><td>${no('No')}</td></tr>
 <tr><td>Part file next to the destination</td><td>${yes('Yes')}, renamed in place at the end</td><td>${no('rclone decides')}</td></tr>
 <tr><td>Queues and the scheduler</td><td>${yes('Yes')}</td><td>${yes('Yes')}</td></tr>
 <tr><td>Inbound speed limit</td><td>${yes('Yes')}</td><td>Passed to rclone as a limit</td></tr>
 <tr><td>Resume after a stop or restart</td><td>${yes('Yes')}, from saved offsets</td><td>rclone's own rules</td></tr>
 <tr><td>Remote cannot read ranges</td><td>One connection; a stopped download starts again</td><td>rclone's own handling</td></tr>
 <tr><td>Checksum check afterwards</td><td>${yes('Yes')}, when the remote reports one</td><td>rclone's checks</td></tr></table></div>`};

 notes:['The web UI on a phone: your sites first, then a remote folder with tick boxes and a Download bar. Touch targets are 40 px.','The server (Docker or the Windows bridge) runs the connections and rclone itself. The phone only sends commands and reads state.','Docker image: put rclone inside it, or expect a mounted rclone.conf and a rclone you install? The first is simpler, the second is smaller.'],
 r:()=>{
  const site=(i,n,t,s)=>`<div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-bottom:1px solid var(--divider)"><span class="c-info">${ic(i)}</span><div style="flex:1;min-width:0"><div>${n}</div><div class="sec" style="font-size:12px">${t}</div></div><i class="dot ${s||''}"></i></div>`;

  return `<div class="phones"><div class="phone"><div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--chrome);border-bottom:1px solid var(--divider)">${ic('menu')}<b style="font-size:16px;font-weight:600">Sites</b></div>
  ${site('server','nas.home.lan','SFTP','on')}${site('server','files.example.org','FTP · not encrypted','')}${site('cloud','cloud.example.net','WebDAV','on')}${site('cloud','gdrive','rclone · Google Drive','on')}${site('cloud','vault','rclone · crypt','')}
  <div style="padding:14px">${bt('Add site',{acc:1,i:'plus'})}</div></div>
  <div class="phone"><div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--chrome);border-bottom:1px solid var(--divider)">${ic('chevr').replace('<svg','<svg style="transform:rotate(180deg)"')}<div><b style="font-size:16px;font-weight:600">gdrive</b><div class="sec" style="font-size:12px">/Projects/2026/Renders</div></div></div>
  ${f('v6','','', 'd')}${f('v7','','', 'd')}${f('render-v7.mov','2.4 GB',1)}${f('render-v6.mov','2.1 GB',1)}${f('moodboard.pdf','12 MB',0)}${f('notes.txt','2 KB',0)}
  <div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--chrome);border-top:1px solid var(--divider)"><span style="flex:1">2 selected · 4.5 GB</span>${bt('Download',{acc:1,i:'download'})}</div></div></div>`;}};

/* engine */
const winEl=document.getElementById('win'),rail=document.getElementById('rail'),notes=document.getElementById('notes');
let cur='wd-browse';
function buildRail(){
  let last='',h='';
  Object.keys(S).forEach(k=>{
    const s=S[k];
    if(s.g!==last){h+=`<div class="rg">${s.g}</div>`;last=s.g}
    h+=`<button class="ri ${k===cur?'on':''}" type="button" data-go="${k}"><b style="font-weight:600;font-size:14px">${s.l}</b><span>${s.d}</span></button>`;
  });
  rail.innerHTML=h;
}
function show(id){
  if(!S[id])id='wd-browse';
  if(id!==cur)M.tested=false;
  cur=id;
  winEl.innerHTML=S[id].r();
  const n=S[id].notes;
  notes.innerHTML=`<div class="note"><h4>What you see</h4><p>${n[0]}</p></div><div class="note"><h4>What the Host does</h4><p>${n[1]}</p></div><div class="note q"><h4>To decide</h4><p>${n[2]}</p></div>`;
  buildRail();
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){show(g.getAttribute('data-go'));return}
  const r=e.target.closest('.rd');
  if(r){const grp=r.getAttribute('data-grp');winEl.querySelectorAll('.rd[data-grp="'+grp+'"] i').forEach(i=>i.classList.remove('on'));r.querySelector('i').classList.add('on');return}
  const c=e.target.closest('.cb');
  if(c){const i=c.querySelector('i');const on=!i.classList.contains('on');i.classList.toggle('on',on);i.innerHTML=on?ic('check'):'';return}
  const row=e.target.closest('.lr');
  if(row&&row.closest('.panes')){row.classList.toggle('sel');return}
  const tst=e.target.closest('.w2 .df .b');
  if(tst&&tst.textContent.trim()==='Test connection'){M.tested=true;winEl.innerHTML=S[cur].r()}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='wpre'){M.wpre=e.target.value;M.tested=false}
  else if(id==='wlog'){M.wlog=e.target.value;M.tested=false}
  else if(id==='rmote'){M.rmote=e.target.value;M.tested=false}
  else return;
  winEl.innerHTML=S[cur].r();
});
const tbtn=document.getElementById('themebtn');
let tm='system';
try{tm=localStorage.getItem('inb-theme')||'system'}catch(e){}
function applyTheme(){
  const r=document.documentElement;
  if(tm==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',tm);
  tbtn.textContent='Theme: '+tm;
  try{localStorage.setItem('inb-theme',tm)}catch(e){}
}
tbtn.addEventListener('click',()=>{tm=tm==='system'?'dark':tm==='dark'?'light':'system';applyTheme()});
applyTheme();
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'wd-browse');
