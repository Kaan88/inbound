S['uni-browse']={g:'One UI for every site',l:'Same panes, any site',d:'Change the site type above',
 notes:['Use the buttons above the window to switch the remote between SFTP, FTP, WebDAV and two rclone remotes. The panes, toolbar and queue do not change. Only the chip and the items the site can do change.','A site describes what it can do, and the window shows only those commands. SFTP and rclone share everything because they share that description.','Hide commands a site cannot do, as drawn, or show them dimmed with a reason? Hiding matches your design guidelines.'],
 r:()=>{const s=site();return win({sel:s.n,st:dotsAll,site:1,dl:'118.4 MB/s',main:`<div class="panes">${LP()}<div style="position:relative">${RP()}${menuFor(s)}</div></div>${qT(0,[3,1,24],TR(s))}`,status:defStatus(),chip:SCHIP})}};

const MU={proto:'sftp',logon:'Key file',enc:0,remote:'gdrive',tested:false};
function capsStrip(c){
  const on=[],off=[];
  capsList.forEach(x=>{const v=c[x[0]];
    if(v===1)on.push(`<span class="chipn ok">${x[1]}</span>`);
    else if(v==='some')on.push(`<span class="chipn">${x[1]} · when the server reports it</span>`);
    else if(v==='copy')on.push(`<span class="chipn">${x[1]} · copies, then deletes</span>`);
    else if(v==='virtual')on.push(`<span class="chipn">${x[1]} · exists once it holds a file</span>`);
    else off.push(x[1]);});
  return `<div><div style="font-weight:600;margin-bottom:6px">What this site can do</div><div style="display:flex;flex-wrap:wrap;gap:6px">${on.join('')}</div>${off.length?`<div class="sec" style="font-size:12px;margin-top:6px">Not available here: ${off.join(', ')}.</div>`:''}</div>`;
}
function uniMgr(){
  const p=MU.proto;
  const protos=[['sftp','SFTP, SSH File Transfer'],['ftp','FTP, with explicit TLS'],['ftps','FTPS, implicit TLS'],['dav','WebDAV'],['rclone','rclone remote']];
  const opt=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('');
  const opt1=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
  const logons=p==='sftp'?['Normal','Ask for password','Key file','SSH agent']:p==='dav'?['Basic (user and password)','App password','Bearer token','Ask for password']:['Normal','Ask for password','Anonymous'];
  if(logons.indexOf(MU.logon)<0)MU.logon=logons[p==='sftp'?2:0];
  const encs=['Use explicit FTP over TLS if available','Require explicit FTP over TLS','Allow plain FTP for this site (insecure)'];
  const remotes=['gdrive','b2-media','vault'];
  const caps=p==='sftp'?SITES.sftp.caps:(p==='ftp'||p==='ftps')?SITES.ftp.caps:p==='dav'?SITES.dav.caps:(MU.remote==='gdrive'?SITES.gd.caps:MU.remote==='b2-media'?SITES.s3.caps:{dl:1,ul:1,del:1,ren:'copy',mk:'virtual',perm:0,resume:1,multi:1,hash:0,free:0});
  const hostRow=p==='rclone'?`<div class="g2"><div class="fld"><label for="urem">Remote</label><select class="in" id="urem">${opt1(remotes,MU.remote)}</select></div><div class="fld"><label>Folder in the remote</label><input class="in" value="/Projects/2026" readonly></div></div>`
   :`<div class="g2"><div class="fld"><label>${p==='dav'?'Server address':'Host'}</label><input class="in" value="${p==='dav'?'https://cloud.example.net/remote.php/dav/files/kaan/':p==='sftp'?'nas.home.lan':'files.example.org'}" readonly></div><div class="fld"><label>Port</label><input class="in" value="${p==='sftp'?22:p==='ftp'?21:p==='ftps'?990:443}" readonly></div></div>`;
  const login=p==='rclone'?`<div class="sec" style="font-size:12px">Sign-in lives in rclone.conf and is managed by rclone. ${MU.remote==='vault'?'Names and contents are decrypted when listed.':''}</div>`:
   `<div class="g2"><div class="fld"><label for="ulog">Logon type</label><select class="in" id="ulog">${opt1(logons,MU.logon)}</select></div><div class="fld"><label>User</label><input class="in" value="${MU.logon==='Anonymous'?'anonymous':'kaan'}" readonly></div></div>${MU.logon==='Key file'?`<div class="fld"><label>Key file</label><div style="display:flex;gap:8px"><input class="in" value="C:\\Users\\kaank\\.ssh\\id_ed25519" readonly>${bt('Browse')}</div></div>`:''}`;
  const enc=p==='ftp'?`<div class="fld"><label for="uenc">Encryption</label><select class="in" id="uenc">${opt1(encs,encs[MU.enc])}</select></div>${MU.enc===2?info('warn','Plain FTP.','Your password and files can be read on the network. You are asked once to confirm when you connect.'):''}`:'';
  const tree=`<div class="tree"><div class="si"><span class="sec">${ic('folder')}</span><span>Sites</span></div>${Object.keys(SITES).map(k=>`<div class="si ${k===(p==='dav'?'dav':p==='rclone'?(MU.remote==='b2-media'?'s3':'gd'):p==='sftp'?'sftp':'ftp')?'on':''}" style="margin-left:22px">${ic(SITES[k].tag==='rclone'||SITES[k].tag==='WebDAV'?'cloud':'server')}<span>${SITES[k].n}</span></div>`).join('')}<div style="display:flex;gap:6px;padding:12px 8px">${bt('New site')}${bt('Delete')}</div></div>`;
  const form=`<div class="form"><div class="g2"><div class="fld"><label for="uproto">Protocol</label><select class="in" id="uproto">${opt(protos,p)}</select></div><div class="fld"><label>Name</label><input class="in" value="${p==='rclone'?MU.remote:p==='sftp'?'nas.home.lan':p==='dav'?'cloud.example.net':'files.example.org'}" readonly></div></div>${hostRow}${enc}${login}
  <div class="g2"><div class="fld"><label>Simultaneous transfers</label><input class="in" value="3" readonly></div><div class="fld"><label>Connections per file</label><input class="in" value="${caps.multi===1?4:1}" readonly></div></div>
  <div>${cb('Upload to a temporary name and rename when done',1)}</div>
  ${capsStrip(caps)}${MU.tested?info('ok','Connected.',p==='rclone'?'rclone 1.68.2 · '+MU.remote+' · 31 items.':'31 items in the folder.'):''}</div>`;
  return sec('Site Manager','server',`<div class="mgr">${tree}${form}</div>`,`${bt('Test connection',{i:'plug'})}<span class="grow"></span>${bt('Save')}${bt('Connect',{acc:1,go:'uni-browse'})}${bt('Cancel',{go:'uni-browse'})}`,760);
}
S['uni-manager']={g:'One UI for every site',l:'One Site Manager',d:'Protocol list includes rclone',
 notes:['One Site Manager with rclone remotes in the same protocol list. Change Protocol, Logon type, Encryption or Remote, and the form and the "What this site can do" strip follow.','The strip is what the window uses to show or hide commands. rclone gets its list from the remote it points at, and SFTP gets a fixed one.','Plain FTP is an explicit third choice in Encryption, with a warning, and a confirmation the first time you connect. That is the rule you picked.'],
 r:()=>{const s=site();return win({sel:s.n,st:dotsAll,site:1,main:`<div class="panes">${LP()}${RP()}</div>${qT(0,[3,1,24],TR(s))}`,status:defStatus(),chip:SCHIP,over:uniMgr()})}};

S['uni-matrix']={g:'One UI for every site',l:'What each can do',d:'The table behind the strip',
 notes:['What each kind of site can do, in one table. This is the description the window reads. "Sometimes" means only when the server or the remote reports it.','SFTP and rclone differ in only a few cells, which is why the same panes work for both.','Treat the table as a starting point. I have not tested every server, and rclone remotes vary a lot.'],
 r:()=>{const keys=['sftp','ftp','dav','s3','gd'];const heads=['SFTP','FTP and FTPS','WebDAV','rclone, object store','rclone, Drive'];
  const cell=v=>v===1?tickc('Yes'):v==='some'?partc('Sometimes'):v==='copy'?partc('Copies, then deletes'):v==='virtual'?partc('Once it holds a file'):noc('No');
  return `<div class="x"><h2>What each kind of site can do</h2><p>One description per kind of site. The window shows a command only when the site has it.</p><div style="overflow-x:auto"><table class="cmp"><tr><th></th>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${capsList.map(c=>`<tr><td>${c[1]}</td>${keys.map(k=>`<td>${cell(SITES[k].caps[c[0]])}</td>`).join('')}</tr>`).join('')}</table></div></div>`;}};

 notes:['Drag files or folders from the local pane onto the remote pane. The pane shows where they will land, and each upload becomes a row with an orange arrow.','Uploads are queued jobs like downloads. Folders upload as one package, and the same per-site limits apply.','Decided: uploads exist. Is Upload also a toolbar button and a context menu item? Both are drawn.'],

S['up-conflict']={g:'Uploads and remote changes',l:'File already on the server',d:'Replace, keep both, skip',
 notes:['Uploading a file the server already has asks once, with both copies side by side and which is newer. A partial upload from an earlier try offers Resume where the protocol can.','Uploads go to a temporary name and are renamed when they finish, so a stopped upload never leaves a half file under the real name. The checkbox is the default setting.','Replace without asking when the server copy is older? I would still ask the first time.'],

  return win({sel:s.n,st:dotsAll,site:1,main:`<div class="panes">${LP()}${RP()}</div>${qT(0,[0,0,24],[])}`,status:defStatus(),chip:SCHIP,over:dlg2('This file is already on the server',body,`${bt('Cancel',{go:'up-drag'})}${bt('Continue',{acc:1,go:'up-drag'})}`,ic('upload'),540)})}};

S['ops-chmod']={g:'Uploads and remote changes',l:'Permissions',d:'SFTP and FTP only',
 notes:['The permissions dialog exists only for sites that have permissions, which is SFTP and FTP. It shows the owner and group read-only, a grid of boxes and the number.','The Host sends a chmod. For folders there is a box that applies it to everything inside.','Nothing to decide.'],
 r:()=>{const s=SITES.sftp;const row=(l,v)=>`<div style="display:grid;grid-template-columns:90px repeat(3,70px);align-items:center;gap:6px">${[`<span>${l}</span>`].concat(v.map(x=>cb('',x))).join('')}</div>`;
  return win({sel:s.n,st:dotsAll,site:1,main:`<div class="panes">${LP()}${pane({remote:1,title:s.n,chip:s.chip,path:s.path,rows:s.rows,foot:s.foot})}</div>${qT(0,[0,0,24],[])}`,status:defStatus(),chip:SCHIP,over:dlg2('Permissions for ubuntu-26.04-desktop-amd64.iso',`<div class="kv"><span>Owner</span><span>kaan</span><span>Group</span><span>users</span></div><div style="display:grid;grid-template-columns:90px repeat(3,70px);gap:6px;color:var(--sec);margin-bottom:4px"><span></span><span>Read</span><span>Write</span><span>Run</span></div>${row('Owner',[1,1,0])}${row('Group',[1,0,0])}${row('Others',[1,0,0])}<div class="fld" style="margin-top:12px;width:120px"><label>Number</label><input class="in mono" value="644" readonly></div>`,`${bt('Cancel',{go:'uni-browse'})}${bt('Change',{acc:1,go:'uni-browse'})}`,ic('key'),460)})}};

S['ftp-plain']={g:'Uploads and remote changes',l:'Plain FTP, asked once',d:'The opt-in you chose',
 notes:['When a server does not offer encryption, you are asked once, per site, and the choice is remembered for that site. Until then nothing is sent.','The Host tries TLS first. Only after you confirm does it fall back, and the site then wears the "not encrypted" chip everywhere it appears.','Decided: plain FTP is allowed. Should the question come back every few months, or never? I drew never.'],
 r:()=>{const s=SITES.ftp;return win({sel:s.n,st:{sftp:'on',ftp:'busy',dav:'on',s3:'on',gd:'on'},site:1,main:`<div class="panes">${LP()}${RP({state:'<div class="state"><div class="ring"></div><div>Waiting for you</div></div>',foot:'Not connected'}) .replace('Waiting for you','Waiting for you')}</div>${qT(0,[0,0,24],[])}`,status:'Connecting to files.example.org…',over:dlg2('Use plain FTP for this site?',`<p><b>files.example.org</b> does not offer encryption.</p>${info('warn','Your password and your files can be read on the network.','Only continue if you trust the network between here and the server.')}<div style="margin-top:12px">${cb('Do not ask again for this site',1)}</div>`,`${bt('Cancel',{go:'uni-browse'})}${bt('Use plain FTP for this site',{acc:1,go:'uni-browse'})}`,ic('unlock','st-wait'),540)})}};

/* ============ SETUP AND DOCKER ============ */
S['setup-rclone']={g:'Setup, Docker and servers',l:'rclone in Setup',d:'A component you can untick',
 notes:['rclone is a component in Setup, ticked by default, with its size beside it. Leaving it out is allowed, and Options can point to your own copy later.','The bundled copy ships with its licence text and updates with Inbound. Your own rclone is never updated by Inbound.','The size is a placeholder until it is measured against the 200 MB install. If it is too big, a separate download from Options is the fallback.'],
 r:()=>`<div class="x"><div style="max-width:640px;margin:0 auto;background:var(--win);border:1px solid var(--divider);border-radius:8px;overflow:hidden"><div class="title" style="height:36px"><span>Setup · Inbound Download Manager</span></div><div style="padding:16px 22px"><div style="font-size:18px;font-weight:600;margin-bottom:2px">Select components</div><div class="sec" style="margin-bottom:12px">Choose what to install. You can add the rest later.</div>
 <div class="card" style="padding:4px 12px"><div class="lr" style="--cols:1fr 90px;height:36px">${cb('Inbound Download Manager <span class="sec">(required)</span>',1)}<span class="sec r">about 190 MB</span></div><div class="lr" style="--cols:1fr 90px;height:36px">${cb('Browser integration',1)}<span class="sec r">small</span></div><div class="lr" style="--cols:1fr 90px;height:46px">${cb('rclone 1.68.2<br><span class="sec" style="font-size:12px">Google Drive, OneDrive, S3, B2 and more, in the same Sites view</span>',1)}<span class="sec r">about 50 MB</span></div></div>
 <div class="sec" style="margin-top:10px;font-size:12px">Space needed: about 240 MB. Sizes are placeholders until measured.</div></div><div class="df">${bt('Back')}${bt('Next',{acc:1})}${bt('Cancel')}</div></div></div>`};

S['rclone-source']={g:'Setup, Docker and servers',l:'Bundled or your own',d:'Options choice',
 notes:['Options keeps a choice: use the rclone that came with Inbound, or one of your own. A custom path wins if you set it, and the page says which is in use.','The Host starts whichever you chose, on 127.0.0.1 with a random port and password.','If you use your own rclone and it is too old for a feature, the page says so with the version it found.'],
 r:()=>{const items=['General','Connection','Folders','Sites','rclone','Web UI'].map(i=>`<div class="si ${i==='rclone'?'on':''}"><span>${i}</span></div>`).join('');
  const body=`<div class="mgr" style="grid-template-columns:190px minmax(0,1fr)"><div class="tree" style="min-height:420px;padding-top:10px">${items}</div><div class="form" style="gap:12px"><div style="font-size:20px;font-weight:600">rclone</div>${info('ok','Using the rclone that came with Inbound.','Version 1.68.2. It updates with Inbound.')}${rd('The rclone that came with Inbound <span class="sec">(1.68.2)</span>',1,'src')}${rd('My own rclone',0,'src')}<div class="fld"><label>Path to my rclone</label><div style="display:flex;gap:8px"><input class="in mono" value="C:\\Tools\\rclone\\rclone.exe" readonly>${bt('Browse…')}</div><div class="sec" style="font-size:12px">Found 1.69.0. Inbound never updates a rclone you chose.</div></div><div class="fld"><label>Config file</label><input class="in mono" value="C:\\Users\\kaank\\AppData\\Roaming\\rclone\\rclone.conf" readonly></div></div></div>`;
  return win({sel:'gdrive',st:dotsAll,site:1,main:`<div class="panes">${LP()}${RP()}</div>${qT(0,[0,0,24],[])}`,status:defStatus(),chip:SCHIP,over:sec('Options','sliders',body,`<span class="grow"></span>${bt('OK',{acc:1,go:'uni-browse'})}${bt('Cancel',{go:'uni-browse'})}${bt('Apply')}`,820)})}};

S.docker={g:'Setup, Docker and servers',l:'Docker with rclone',d:'Config in one volume',
 notes:['The image carries rclone. Sites, settings and rclone.conf all live in one config volume, so a rebuilt container keeps every remote.','The server runs the connections and rclone; the browser or phone only sends commands. The image stays linux/amd64 only for now.','Names and paths are a sketch. The image name and the volume layout are not decided.'],
 r:()=>`<div class="x"><h2>Docker</h2><p>A sketch of the compose file. Names are placeholders.</p><div class="term">services:
  inbound:
    image: inbound-server            <span class="d"># name not decided</span>
    ports: ["8080:8080"]
    volumes:
      - ./downloads:/downloads       <span class="d"># where files land</span>
      - ./config:/config             <span class="d"># sites, settings and rclone/rclone.conf</span></div></div>`};

S['docker-oauth']={g:'Setup, Docker and servers',l:'Adding Drive with no browser',d:'Headless server',
 notes:['A server has no browser, so adding Google Drive asks you to sign in on another computer and paste the result. The steps are in the dialog.','rclone has a mode for exactly this: it prints a token on a computer with a browser. Inbound only passes the pasted text to rclone and never shows it again.','The same dialog serves the Windows app when its Host runs as a service with no desktop.'],
 r:()=>`<div class="win" style="min-width:0;min-height:520px"><div class="title"><span>Inbound web UI · https://nas.home.lan:8080</span></div>${dlg2('Add Google Drive',`<p>This server has no browser, so sign in on another computer.</p><div class="kv" style="grid-template-columns:24px 1fr"><span>1</span><span>On a computer with rclone, run <span class="mono">rclone authorize "drive"</span></span><span>2</span><span>Sign in in the browser it opens.</span><span>3</span><span>Paste what rclone prints here.</span></div><div class="fld"><label>Result from rclone</label><textarea class="in" style="height:84px;padding:8px;font-family:Consolas,monospace;font-size:12px" readonly>{"access_token":"…","token_type":"Bearer","expiry":"…"}</textarea></div><div class="sec" style="font-size:12px;margin-top:6px">Inbound hands this to rclone and does not keep it.</div>`,`${bt('Cancel')}${bt('Add remote',{acc:1})}`,ic('cloud'),540)}</div>`};

/* ---------- engine ---------- */
const winEl=document.getElementById('win'),rail=document.getElementById('rail'),notes=document.getElementById('notes'),pick=document.getElementById('pick');
let cur='pl-compare';
function buildRail(){
  let last='',h='';
  Object.keys(S).forEach(k=>{const s=S[k];if(s.g!==last){h+=`<div class="rg">${s.g}</div>`;last=s.g}
    h+=`<button class="ri ${k===cur?'on':''}" type="button" data-go="${k}"><b style="font-weight:600;font-size:14px">${s.l}</b><span>${s.d}</span></button>`;});
  rail.innerHTML=h;
  pick.innerHTML='<span class="sec" style="font-size:13px">Remote in the browse screens:</span>'+Object.keys(SITES).map(k=>`<button class="pb ${k===SK?'on':''}" type="button" data-site="${k}">${SITES[k].tag==='rclone'?'rclone · '+SITES[k].n:SITES[k].tag}</button>`).join('');
}
function show(id){
  if(!S[id])id='pl-compare';
  if(id!==cur)MU.tested=false;
  cur=id;
  winEl.innerHTML=S[id].r();
  const n=S[id].notes;
  notes.innerHTML=`<div class="note"><h4>What you see</h4><p>${n[0]}</p></div><div class="note"><h4>What the Host does</h4><p>${n[1]}</p></div><div class="note q"><h4>Open or decided</h4><p>${n[2]}</p></div>`;
  buildRail();
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){show(g.getAttribute('data-go'));return}
  const sb=e.target.closest('[data-site]');
  if(sb){SK=sb.getAttribute('data-site');show(cur);return}
  const r=e.target.closest('.rd');
  if(r){const grp=r.getAttribute('data-grp');winEl.querySelectorAll('.rd[data-grp="'+grp+'"] i').forEach(i=>i.classList.remove('on'));r.querySelector('i').classList.add('on');return}
  const c=e.target.closest('.cb');
  if(c){const i=c.querySelector('i');const on=!i.classList.contains('on');i.classList.toggle('on',on);i.innerHTML=on?ic('check'):'';return}
  const row=e.target.closest('.lr');
  if(row&&row.closest('.panes')){row.classList.toggle('sel');return}
  const tst=e.target.closest('.w2 .df .b');
  if(tst&&tst.textContent.trim()==='Test connection'){MU.tested=true;winEl.innerHTML=S[cur].r()}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='uproto'){MU.proto=e.target.value;MU.tested=false}
  else if(id==='ulog'){MU.logon=e.target.value;MU.tested=false}
  else if(id==='uenc'){MU.enc=e.target.selectedIndex;MU.tested=false}
  else if(id==='urem'){MU.remote=e.target.value;MU.tested=false}
  else return;
  winEl.innerHTML=S[cur].r();
});
const tbtn=document.getElementById('themebtn');
let tm='system';
try{tm=localStorage.getItem('inb-theme')||'system'}catch(e){}
function applyTheme(){
  const r=document.documentElement;
  if(tm==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',tm);
  tbtn.textContent='Theme: '+tm;
  try{localStorage.setItem('inb-theme',tm)}catch(e){}
}
tbtn.addEventListener('click',()=>{tm=tm==='system'?'dark':tm==='dark'?'light':'system';applyTheme()});
applyTheme();
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'pl-compare');

</script>
