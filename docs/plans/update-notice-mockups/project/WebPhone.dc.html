      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6fa8dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>
      <p style="margin: 0; flex-grow: 1; line-height: 1.4"><strong>Inbound 0.7.4 is out for Docker.</strong> <span style="color: #cfcfcf">This server runs 0.7.2.</span></p>
      <button aria-label="Dismiss" style="background: transparent; border: 0; color: #a3a3a3; width: 44px; height: 44px; margin: -12px -12px 0 0; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="display: flex; gap: 8px">
      <a href="WebDialog.dc.html" style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; background: #4aa3f0; color: #0e1b2a; border-radius: 4px; text-decoration: none; font-weight: 600">What's new and how</a>
      <button style="height: 44px; background: transparent; color: #ececec; border: 1px solid #3e4a57; border-radius: 4px; padding: 0 16px">Not now</button>
    </div>
  </section>
  <div style="display: flex; flex-direction: column">
    <div style="padding: 12px 14px; border-bottom: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 4px">
      <span>ubuntu-26.04-desktop-amd64.iso</span>
      <span style="color: #a3a3a3; font-size: 12px"><span style="color: #6db3f2">41%</span> · 6.1 GB · 28.4 MB/s · 3 min</span>
    </div>
    <div style="padding: 12px 14px; border-bottom: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 4px">
      <span>photos-2026.zip</span>
      <span style="color: #a3a3a3; font-size: 12px"><span style="color: #5dc879">Completed</span> · 2.3 GB</span>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <footer style="height: 32px; display: flex; align-items: center; padding: 0 14px; border-top: 1px solid #343434; color: #a3a3a3; font-size: 12px">
    <span>2 downloads · 1 active</span>
    <div style="flex-grow: 1"></div>
    <span>What's new</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
