<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Store image frame</title>
  <!-- The frame of the store images (EXT.R8 §7), composed by store-screens.mjs: the app's chrome colour, a caption on
       the left and the real extension page on the right in an iframe. No browser chrome is imitated. -->
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    html, body { margin: 0; background: var(--chrome); color: var(--text); font-family: var(--font-sans); }
    body { width: 1280px; height: 800px; overflow: hidden; display: flex; align-items: center; }
    body.promo { width: 440px; height: 280px; display: block; }
    .caption { flex: none; box-sizing: border-box; width: var(--caption-width, 430px); padding: 0 40px 0 72px; }
    .caption img { display: block; margin-bottom: 20px; }
    .caption h1 { margin: 0 0 12px; font-size: 28px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
    .caption p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--muted); }
    .stage { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center; padding-right: 56px; }
    .surface {
      position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--divider);
      border-radius: var(--radius-dialog); box-shadow: 0 6px 24px var(--shadow);
    }
    .surface iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: var(--surface); }
    body.compact .caption { padding: 0 24px 0 40px; }
    body.compact .stage { padding-right: 40px; }
    .surface img { position: absolute; left: 0; top: 0; display: block; }
    .promo-head { display: flex; align-items: center; gap: 16px; padding: 22px 24px 0; }
    .promo-head h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; line-height: 1.2; }
    .promo-head p { margin: 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
    .promo .surface { position: absolute; left: 29px; bottom: 22px; border-radius: var(--radius-card); box-shadow: none; }
  </style>
</head>
<body>
  <script src="/__screens/store-frame.js"></script>
</body>
</html>
