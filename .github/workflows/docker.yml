# Builds the server image for linux/amd64 (arm64 is not published yet: never run) and pushes it to ghcr.io/kaan88/inbound when a release
# of a version tag (v*) is published (D3), or by hand: Actions, Docker image, Run workflow, and choose the tag under
# "Use workflow from". It used to run on the pushed tag, but GitHub starts nothing for a push whose commit message has
# [skip ci], and the 0.7.3 and 0.7.4 release commits had it, so neither got an image (CI.1). A published release is
# not a push, so it always starts this. A run from a branch does nothing: the job needs a v* tag.
# Actions are pinned to the commit of the release named beside each.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'Kaan88/inbound' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kaan88/inbound
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Inbound Download Manager

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

  # UPD.D1: the server reads a small signed file, manifest-docker.json, so Docker installs notice a new image. A job of its
  # own, after the image is pushed, so only this job can write to the release and sees the signing key. It is signed with
  # the same UPDATE_SIGNING_KEY as the Windows and Linux manifests, checked against the release's public.pem first.
  sign:
    needs: image
    if: github.repository == 'Kaan88/inbound' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Sign the Docker update file
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "The UPDATE_SIGNING_KEY secret is missing."; exit 1; }
          key="$RUNNER_TEMP/update-signing.pem"
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p public.pem -D "$RUNNER_TEMP/release"
          test "$(openssl pkey -in "$key" -pubout | tr -d '\r\n')" = "$(tr -d '\r\n' < "$RUNNER_TEMP/release/public.pem")" \
            || { echo "The signing key does not match the release's public.pem."; exit 1; }
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)"
          sh scripts/prepare-docker-release.sh "$version" "$key" "$GITHUB_REPOSITORY"
          out="artifacts/release/v$version-docker"
          test -f "$out/manifest-docker.json" && test -f "$out/SHA256SUMS-docker"
          test ! -e "$out/public.pem"
          cat "$out/SHA256SUMS-docker"
          gh release upload "$GITHUB_REF_NAME" "$out/manifest-docker.json" "$out/SHA256SUMS-docker" \
            -R "$GITHUB_REPOSITORY" --clobber
          echo "Attached manifest-docker.json and SHA256SUMS-docker to $GITHUB_REF_NAME."
