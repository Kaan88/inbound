<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbound Download Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <header class="brand">
    <img src="icons/icon32.png" alt="" width="24" height="24" />
    <div>
      <strong>Inbound Download Manager</strong>
      <span id="statusText" class="muted">Checking connection…</span>
    </div>
  </header>

  <section id="statusCard" class="card status-card">
    <span id="statusDot" class="dot"></span>
    <span id="statusLabel">Desktop app</span>
    <span id="statusDetail" class="muted"></span>
  </section>
  <section id="serverCard" class="card status-card hidden">
    <span id="serverDot" class="dot"></span>
    <span id="serverLabel">Server</span>
    <span id="serverDetail" class="muted"></span>
    <button id="openServer" class="link-button" type="button">Open the web UI</button>
  </section>
  <section id="targetCard" class="card target-card hidden" role="group" aria-labelledby="targetHeading">
    <span id="targetHeading">Send downloads to</span>
    <div class="segmented">
      <button id="targetLocal" type="button" data-target="local" aria-pressed="false">This PC</button>
      <button id="targetServer" type="button" data-target="server" aria-pressed="false">Server</button>
    </div>
  </section>
  <section id="autoCard" class="card auto-card">
    <span id="autoState" class="auto-state">Automatic sending: checking…</span>
    <button id="autoTurnOn" class="link-button hidden" type="button">Turn on in Settings</button>
  </section>
  <section id="leftCard" class="card hidden">
    <strong>Left in your browser</strong>
    <ul id="leftList" class="left-list"></ul>
  </section>
  <p id="getAppRow" class="get-app"><a id="getApp" class="hidden" href="https://github.com/Kaan88/inbound/releases/latest" target="_blank" rel="noopener">Get the desktop app</a></p>

  <section class="card">
    <div class="row">
      <strong>Downloads in Inbound</strong>
      <button id="refresh" class="link-button" type="button">Refresh</button>
    </div>
    <ul id="jobs" class="job-list">
      <li class="empty">No downloads.</li>
    </ul>
  </section>

  <div class="actions">
    <button id="downloadAll" type="button">Download all links…</button>
    <button id="openApp" class="primary" type="button">Open app</button>
    <button id="options" type="button">Settings</button>
    <button id="pauseCatching" class="quiet" type="button">Pause catching for 5 min</button>
  </div>

  <p id="error" class="error hidden"></p>
  <script src="popup.js"></script>
</body>
</html>
