# Builds the Windows files: Setup and the update zip (CI.1, CI.2).
#
# - When a version tag (v*) is pushed, or by hand with a tag: a release build from that tag. Setup carries the signed
#   Firefox add-on, the update file (manifest.json) is signed with the UPDATE_SIGNING_KEY repository secret, and the
#   seven files (six with no_firefox_xpi; Setup, zip, manifest.json, public.pem, the Firefox add-on, SHA256SUMS, and
#   hub.txt, which tells Hub the new version; tools\write-hub-txt.ps1 refuses a release Hub could not read) are put in a DRAFT release with
#   notes drafted from changelog.json. Nothing is public until the owner reads the draft, finishes the notes and
#   publishes it; publishing then starts the Linux packages and the Docker image (their workflows).
# - By hand without a tag: a test build of the chosen branch, kept as run artifacts for 14 days. Setup then has no
#   Firefox add-on, and nothing is signed or put in a release.
#
# GitHub starts nothing for a pushed tag whose commit message has [skip ci]. Leave it off the release commit, or run
# this by hand with the tag.
#
# The Firefox add-on is signed by addons.mozilla.org once per extension version, locally
# (scripts\sign-extension-firefox.ps1), and extensions/firefox-updates.json in the tagged commit names it with its
# hash. This workflow takes the file from a draft release of this tag if the owner made one and attached it there,
# else from the newest earlier release that has it, and checks it against that hash.
#
# The native torrent worker takes long to build (vcpkg builds libtorrent and Boost), so the built
# inbound-torrent.exe is cached and rebuilt only when native/torrent-worker changes.
# Actions are pinned to the commit of the release named beside each.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag for a release build into a draft release (for example v0.7.5). Empty: test build of this branch."
        required: false
        default: ""
      no_firefox_xpi:
        description: "Release build without the signed Firefox add-on (the listed version is not approved by addons.mozilla.org yet). Setup then only links the AMO listing, and the release gets five files."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    if: github.repository == 'Kaan88/inbound'
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      # Empty for a test build of a branch.
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      # "true" only for a by-hand run with no_firefox_xpi ticked; a pushed tag always has the add-on.
      NO_FIREFOX_XPI: ${{ inputs.no_firefox_xpi && 'true' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Version
        shell: powershell
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '/Project/PropertyGroup/Version').Node.InnerText.Trim()
          if ($version -notmatch '^\d+(\.\d+){2,3}$') { throw "No version in Directory.Build.props: '$version'" }
          if ($env:TAG) {
              if ($env:TAG -cne "v$version") { throw "Directory.Build.props says $version, the tag is $env:TAG" }
              Write-Host "Release build of $env:TAG"
          } else {
              Write-Host "Test build of $env:GITHUB_REF_NAME as $version; nothing will be signed or released."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            extensions/chrome/package-lock.json

      - name: .NET SDK 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Torrent worker from the cache
        id: worker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/torrent-worker/win-x64
          key: torrent-worker-win-x64-${{ hashFiles('native/torrent-worker/**') }}

      - name: Build the torrent worker (vcpkg; long)
        if: steps.worker.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          rem build-windows.cmd looks for vcpkg in idm-deps\vcpkg next to the repository.
          git clone https://github.com/microsoft/vcpkg.git "%GITHUB_WORKSPACE%\..\idm-deps\vcpkg" || exit /b 1
          call "%GITHUB_WORKSPACE%\..\idm-deps\vcpkg\bootstrap-vcpkg.bat" -disableMetrics || exit /b 1
          call native\torrent-worker\build-windows.cmd || exit /b 1

      - name: Torrent worker is there
        shell: powershell
        run: |
          $worker = "artifacts\torrent-worker\win-x64\inbound-torrent.exe"
          if (-not (Test-Path -LiteralPath $worker -PathType Leaf)) { throw "$worker is missing." }
          & $worker --version

      - name: Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup was not installed." }

      - name: Signed Firefox add-on (release build)
        if: env.TAG != '' && env.NO_FIREFOX_XPI == ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extensionVersion = ([IO.File]::ReadAllText("extensions\chrome\package.json") | ConvertFrom-Json).version
          $name = "inbound-bridge-$extensionVersion-firefox.xpi"
          $updates = [IO.File]::ReadAllText("extensions\firefox-updates.json") | ConvertFrom-Json
          $entry = @($updates.addons.'inbound-bridge@kaan88'.updates | Where-Object { $_.version -eq $extensionVersion })
          if ($entry.Count -ne 1) { throw "extensions\firefox-updates.json has no entry for extension $extensionVersion. If AMO hasn't approved it yet, run Windows build by hand with this tag and no_firefox_xpi ticked (docs\release-builds.md, CI.2 step 2)." }
          $wanted = $entry[0].update_hash
          $folder = "artifacts\firefox-addon"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $file = Join-Path $folder $name
          # gh writes to stderr when a release has no such file; that must not end the step.
          $ErrorActionPreference = 'Continue'
          # This tag's own (draft) release first, then earlier releases, newest first.
          $tags = @($env:TAG) + @(gh release list -R $env:GITHUB_REPOSITORY --limit 30 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne $env:TAG })
          foreach ($tag in $tags) {
              if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
              gh release download $tag -R $env:GITHUB_REPOSITORY -p $name -D $folder 2>$null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $file)) { continue }
              $hash = "sha256:" + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ceq $wanted) { Write-Host "Took $name from $tag."; exit 0 }
              Write-Host "$name in $tag is not the file firefox-updates.json names; looking further."
          }
          throw "No release has $name with the hash in extensions\firefox-updates.json. Sign it locally (scripts\sign-extension-firefox.ps1 -ReleaseTag $env:TAG), attach it to a draft release of $env:TAG, and run this again."

      - name: Setup
        shell: powershell
        run: |
          if ($env:TAG -and -not $env:NO_FIREFOX_XPI) { .\scripts\build-installer.ps1 -Version $env:VERSION }
          else { .\scripts\build-installer.ps1 -Version $env:VERSION -NoFirefoxXpi }

      - name: Zip
        shell: powershell
        run: .\scripts\package.ps1 -Version $env:VERSION

      - name: Keep them as run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ env.TAG && 'release' || 'test' }}-build-${{ env.VERSION }}
          path: |
            artifacts/installer/InboundSetup-${{ env.VERSION }}.exe
            artifacts/package/Inbound-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Sign the update file and gather the release files
        if: env.TAG != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { throw "The UPDATE_SIGNING_KEY secret is missing." }
          dotnet build tools\UpdateSigner -c Release
          if ($LASTEXITCODE -ne 0) { throw "UpdateSigner did not build." }
          $key = Join-Path $env:RUNNER_TEMP "update-signing.pem"
          try {
              [IO.File]::WriteAllText($key, ($env:UPDATE_SIGNING_KEY.Trim() + "`n"), [Text.UTF8Encoding]::new($false))
              if ($env:NO_FIREFOX_XPI) { .\scripts\prepare-release.ps1 -Version $env:VERSION -PrivateKeyPath $key -NoFirefoxXpi }
              else { .\scripts\prepare-release.ps1 -Version $env:VERSION -PrivateKeyPath $key }
          }
          finally {
              if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
          }
          $out = "artifacts\release\v$env:VERSION"
          # The key must be the one installed apps trust: the public.pem just written equals the latest release's.
          $earlier = Join-Path $env:RUNNER_TEMP "earlier-release"
          gh release download -R $env:GITHUB_REPOSITORY -p public.pem -D $earlier
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch public.pem from the latest release." }
          $normal = { param($path) ([IO.File]::ReadAllText($path) -replace '\s', '') }
          if ((& $normal (Join-Path $out "public.pem")) -cne (& $normal (Join-Path $earlier "public.pem"))) {
              throw "The signing key does not match the latest release's public.pem. Nothing was released."
          }
          Get-Content (Join-Path $out "SHA256SUMS")
          "RELEASE_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: hub.txt (for Hub), checked
        if: env.TAG != ''
        shell: powershell
        run: |
          # The one-line note for Hub: the first bullet of the drafted release notes (the draft's own notes are
          # finished by hand later; Hub shows this line as it stands when the release is published).
          $notesFile = Join-Path $env:RUNNER_TEMP "hub-notes.md"
          .\scripts\release-notes.ps1 -Version $env:VERSION -OutFile $notesFile
          $line = @(Get-Content -LiteralPath $notesFile | Where-Object { $_ -match '^- ' } | Select-Object -First 1)
          $note = if ($line.Count -eq 1) { $line[0].Substring(2).Trim() } else { '' }
          $setup = "InboundSetup-$env:VERSION.exe"
          .\tools\write-hub-txt.ps1 -App inbound -Repo inbound -Version $env:VERSION -Notes $note `
            -Kind setup -Exe 'app\DownloadManager.Host.exe' -Uninstall '{6F4B7C2E-3D91-4E8A-9B57-2C1D0A8E5F13}_is1' `
            -Wait 'app\DownloadManager.Host.exe','app\DownloadManager.Desktop.WinUI.exe','app\DownloadManager.NativeHost.exe' `
            -Files @{ Name = $setup; Role = 'setup'; Path = (Join-Path $env:RELEASE_DIR $setup); Silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER'; Scope = 'user' } `
            -Out (Join-Path $env:RELEASE_DIR "hub.txt")
          # The script exits 1 without throwing, so a refused release shows here as no file (and, run by hand, as the exit code).
          if (-not (Test-Path -LiteralPath (Join-Path $env:RELEASE_DIR "hub.txt") -PathType Leaf)) { throw "hub.txt was not written; nothing was released." }
          Get-Content -LiteralPath (Join-Path $env:RELEASE_DIR "hub.txt")

      - name: Put them in a draft release
        if: env.TAG != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:RELEASE_DIR -File | ForEach-Object { $_.FullName })
          $expected = if ($env:NO_FIREFOX_XPI) { 6 } else { 7 }
          if ($files.Count -ne $expected) { throw "Expected $expected release files, found $($files.Count)." }
          $ErrorActionPreference = 'Continue'
          $state = gh release view $env:TAG -R $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          $found = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($found) {
              if ($state -ne 'true') { throw "A published release $env:TAG already exists; its files are not replaced. Delete or re-draft it by hand if that is meant." }
              gh release upload $env:TAG @files -R $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw "Upload to the draft release failed." }
              Write-Host "Added the release files to the existing draft release $env:TAG. Its notes were left as they are."
          } else {
              $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
              .\scripts\release-notes.ps1 -Version $env:VERSION -OutFile $notes
              gh release create $env:TAG @files -R $env:GITHUB_REPOSITORY --draft --verify-tag `
                  --title "Inbound Download Manager $env:VERSION" --notes-file $notes
              if ($LASTEXITCODE -ne 0) { throw "The draft release was not created." }
              Write-Host "Made the draft release $env:TAG with $($files.Count) files. Finish its notes and publish it; that starts the Linux packages and the Docker image."
          }
