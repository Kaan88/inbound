<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbound server</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1b1f24; --muted: #5b6370; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15181c; --fg: #e8eaed; --muted: #9aa3ad; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 40rem; margin: 10vh auto; padding: 0 16px; }
    p { color: var(--muted); }
    code { font-size: 0.95em; }
  </style>
</head>
<body>
  <main>
    <h1>Inbound server</h1>
    <!-- Placeholder until D2: this page is where the web UI will be served from. -->
    <p>The server is running. Its web UI comes in the next step (D2); until then it is driven through
      <code>/api/ws</code> and <code>/api/ipc</code>, and <code>/health</code> says whether it is up.</p>
    <p><strong>This server has no sign-in yet.</strong> Anyone who can reach it controls its downloads and saved logins.
      Keep it on a network you trust.</p>
  </main>
</body>
</html>
